name: Build Kourosh Gram from Telegram
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'branding/**'
      - 'scripts/**'
      - 'telegram'
      - '.gitmodules'
      - '.github/workflows/android-build.yml'
permissions:
  contents: write
concurrency:
  group: kourosh-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Apply Kourosh Gram branding and API setup
        run: |
          python3 scripts/prepare_telegram.py
          python3 scripts/verify_overlay.py
          rm telegram/TMessagesProj/config/release.keystore
          keytool -genkeypair -keystore telegram/TMessagesProj/config/release.keystore -storepass android -keypass android -alias androidkey -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Kourosh Gram Test Build' -noprompt
      - name: Compile full Telegram Android application
        working-directory: telegram
        run: gradle :TMessagesProj_App:assembleAfatDebug --stacktrace --console=plain
      - name: Verify APK signature and contents
        run: |
          mkdir -p artifacts
          cp telegram/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk artifacts/Kourosh-Gram.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/Kourosh-Gram.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/Kourosh-Gram.apk > artifacts/apk-info.txt
          grep "package: name='com.kouroshgram.messenger'" artifacts/apk-info.txt
          grep "application-label:'Kourosh Gram'" artifacts/apk-info.txt
          unzip -l artifacts/Kourosh-Gram.apk | grep 'lib/arm64-v8a/libtmessages.49.so'
          unzip -l artifacts/Kourosh-Gram.apk | grep 'lib/x86_64/libtmessages.49.so'
          cd artifacts
          sha256sum Kourosh-Gram.apk > SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test setup and Telegram startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/smoke_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kourosh-Gram-APK-and-verification
          path: artifacts/
          if-no-files-found: ignore
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "telegram-build-${GITHUB_RUN_NUMBER}" artifacts/Kourosh-Gram.apk artifacts/SHA256SUMS.txt artifacts/apk-info.txt --target "$GITHUB_SHA" --title "Kourosh Gram 3 · Telegram source build ${GITHUB_RUN_NUMBER}" --notes-file RELEASE_NOTES.md
